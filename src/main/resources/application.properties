spring.application.name=outbox-pattern

# MySQL (docker-compose)
spring.datasource.url=jdbc:mysql://localhost:3306/outbox
spring.datasource.username=outbox
spring.datasource.password=outbox

# AWS / SQS (LocalStack)
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.endpoint=http://localhost:4566
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test

outbox.sqs.queue-name=outbox-events

# Gerador de pedidos para teste (thread iniciada quando a app sobe)
outbox.generator.enabled=true
outbox.generator.interval-ms=1000
